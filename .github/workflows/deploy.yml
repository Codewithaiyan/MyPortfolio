name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get repository name and set basePath
        id: repo
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}')
          echo "repository=$REPO_NAME" >> $GITHUB_OUTPUT
          
          # Check if this is a user/organization page (repo name ends with .github.io)
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "base_path=" >> $GITHUB_OUTPUT
            echo "Detected user/organization page - basePath will be empty"
          else
            echo "base_path=/$REPO_NAME" >> $GITHUB_OUTPUT
            echo "Detected project page - basePath will be /$REPO_NAME"
          fi

      - name: Build with basePath
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.repo.outputs.base_path }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

